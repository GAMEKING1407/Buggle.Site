<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buggle Audio Playground</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="controls">
    <label for="waveform">Waveform:</label>
    <select id="waveform">
      <option value="sine">Sine</option>
      <option value="square">Square</option>
      <option value="sawtooth" selected>Sawtooth</option>
      <option value="triangle">Triangle</option>
    </select>
  </div>
  
  <div class="pad-container">
    <div class="pad-info">
      <span id="frequency">440 Hz</span>
      <span id="volume-display">Volume: 50%</span>
    </div>
    
    <div class="keyboard" id="keyboard"></div>
  </div>
  
  <section class="drum-machine">
    <h2>Drum Machine</h2>
    
    <div class="drum-controls">
      <button id="drum-play">Play</button>
      <button id="drum-stop">Stop</button>
      <button id="drum-clear">Clear</button>
      
      <label>
        BPM
        <input id="drum-bpm" type="number" value="120" min="40" max="240">
      </label>
    </div>
    
    <div id="drum-grid"></div>
  </section>

  <script src="drums.js"></script>
  <script src="synth.js"></script>
</body>
</html>
